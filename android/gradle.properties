org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false

# R8 full mode. The keep rules in proguard-rules.pro cover the autofill
# service and the Flutter entry points, which are reached by the framework
# rather than by any call site R8 can see.
android.enableR8.fullMode=true
